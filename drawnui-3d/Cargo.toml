[package]
name = "drawnui-3d"
version = "0.1.0-preview.1"
edition.workspace = true
license.workspace = true
description = "An add-on for DrawnUI for Rust: 3D models in a DrawnUI screen. glTF scenes with skeleton animations, many objects on one game field, shapes made in code, shaded, cartoon or flat looks."
repository = "https://github.com/DrawnUi/DrawnUi.Rust"
homepage = "https://hellorust.drawnui.net"
readme = "README.md"
keywords = ["drawnui", "3d", "gltf", "ui", "game"]
categories = ["gui", "graphics", "rendering", "game-development"]
# The crate is its code; tests read the example's model from the repository.
include = ["src/**/*", "README.md", "CHANGELOG.md"]

[dependencies]
# The add-on API (Cx::start_frame_loop, Cx::with_control, downcast_state) and the engine.
# On release: the drawnui version that has it.
drawnui = { path = "../drawnui", version = "0.1.0-preview.37" }
# The glTF reader without its image decoders (Skia decodes), and the vector math for poses and cameras.
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
glam = "0.30"
