[package]
name = "drawnui-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "An add-on for DrawnUI for Rust: sound output on desktop, phones and the browser, streams the app pushes, generators and a mixer."
repository = "https://github.com/DrawnUi/DrawnUi.Rust"
readme = "README.md"
keywords = ["drawnui", "audio", "sound", "mixer", "game"]
categories = ["multimedia::audio", "game-development"]
publish = false
include = ["src/**/*", "build.rs", "README.md", "CHANGELOG.md"]

[features]
default = ["files"]
# Samples and music from WAV, MP3, OGG Vorbis and FLAC files (symphonia, pure Rust).
files = ["dep:symphonia"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac"], optional = true }

# Desktop and phones: the system's audio through cpal (WASAPI, Core Audio, ALSA, AAudio).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
cpal = "0.18"
