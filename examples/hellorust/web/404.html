<!doctype html>
<!-- Cloudflare Pages serves this, with status 404, for any address the site does not have, instead
     of the app's page with status 200 (the app's pages live in the URL hash, #/images). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#212529" />
    <title>Not found · DrawnUI for Rust</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #212529;
        color: #f8f9fa;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 420px; padding: 24px 16px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 24px; color: #adb5bd; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 12px;
        background: #0d6efd;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover, a:focus-visible { background: #3d8bfd; outline: 2px solid #ffffff55; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Not found</h1>
      <p>There is nothing at this address.</p>
      <a href="/">Open DrawnUI for Rust</a>
    </main>
  </body>
</html>
