[package]
name = "dungeon-android"
version = "0.0.0"
edition.workspace = true
publish = false

# Dungeon Run as the native library of an Android activity (GameActivity);
# `dev\android.ps1 -Example dungeon` builds it with cargo-ndk, then Gradle packs the APK.
[lib]
crate-type = ["cdylib"]

[dependencies]
drawnui = { path = "../../drawnui" }
dungeon = { path = "../dungeon" }
