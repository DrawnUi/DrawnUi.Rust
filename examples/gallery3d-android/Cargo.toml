[package]
name = "gallery3d-android"
version = "0.0.0"
edition.workspace = true
publish = false

# The 3D gallery as the native library of an Android activity (GameActivity);
# `dev\android.ps1 -Example gallery3d` builds it with cargo-ndk, then Gradle packs the APK.
[lib]
crate-type = ["cdylib"]

[dependencies]
drawnui = { path = "../../drawnui" }
gallery3d = { path = "../gallery3d" }
